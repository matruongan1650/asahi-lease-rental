# /etc/nginx/sites-available/shuyei.conf
# アサヒリース — React SPA + PHP API(/api/*) + uploads を1台で配信。
# 有効化: ln -s /etc/nginx/sites-available/shuyei.conf /etc/nginx/sites-enabled/
#         rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
# HTTPS(443) と HTTP→HTTPS リダイレクトは certbot --nginx が自動追加します。

server {
    listen 80;
    listen [::]:80;
    server_name shuyei.online www.shuyei.online;

    root /var/www/shuyei;      # ← rsync のアップロード先（dist/ の中身）
    index index.html;

    # 写真アップロード(api/upload)のため本文サイズを緩和
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- 内部 include / 秘密ファイルへの直アクセスを拒否（config は特に重要）---
    # ※ この regex を php 実行ブロックより前に置くことで優先させる。
    location ~ ^/api/(config|config\.sample|db|mailer|r2|r2_sync)\.php$ {
        deny all;
        return 404;
    }

    # --- 拡張子なし API (/api/store → /api/store.php) を .php へ内部リライト ---
    # 実在ファイル(= api/uploads/*.jpg 等)はそのまま静的配信、無ければ .php を実行。
    location /api/ {
        try_files $uri @php_extless;
    }
    location @php_extless {
        rewrite ^(.*)$ $1.php last;   # last で location 再評価 → 下の php ブロックへ
    }

    # --- PHP 実行（/api/auth.php 等の直 .php もここ。regex は prefix より優先）---
    # ※ try_files は snippets/fastcgi-php.conf 内に既にあるためここには書かない（重複エラー回避）。
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # --- ハッシュ付きアセットは長期キャッシュ（内容が変わればファイル名も変わる）---
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- index.html は常に再検証（デプロイ直後に新バンドルを読ませる）---
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- SPA フォールバック（/api・/assets 以外の未知パスは index.html）---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
