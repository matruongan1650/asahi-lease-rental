# /etc/php/8.3/fpm/pool.d/z-asahi.conf  （既存 www プールの上書き用に追記でも可）
# 2GB RAM 向け PHP-FPM プロセス数。反映: systemctl restart php8.3-fpm
[www]
pm = dynamic
pm.max_children = 8          # 各 ~40-60MB 想定 → 最大 ~0.5GB。DBと同居でも安全
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500        # メモリリーク対策で定期リサイクル

; --- php.ini 側で設定する項目（/etc/php/8.3/fpm/php.ini）---
; date.timezone = Asia/Tokyo
; memory_limit = 128M
; upload_max_filesize = 20M
; post_max_size = 21M
; expose_php = Off
